# Sitenin gerçek adresi. Sonunda .git OLMAZ, sonunda / olmalı.
baseURL = 'https://huseyinhilal.github.io/'
languageCode = 'en-us'
defaultContentLanguage = 'en'
title = 'Huseyin Hilal Blog'
theme = 'hugo-blog-awesome'
enableEmoji = true

[markup]
  [markup.highlight]
    noClasses = false        # kod renklendirme temanın CSS'iyle yapılır
  [markup.goldmark.renderer]
    unsafe = true            # markdown içinde HTML kullanabilirsin
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
  tag = 'tags'
  category = 'categories'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = 'Journal'
    pageRef = '/journal'
    weight = 30
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 40
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 50

[params]
  sitename = 'Huseyin Hilal Blog'
  description = 'Notes on what I learn, and a developer journal.'
  defaultColor = 'auto'          # dark, light veya auto
  mainSections = ['posts', 'journal']   # ana sayfada listelenen bölümler
  toc = true                     # yazılarda içindekiler tablosu
  tocOpen = false
  goToTop = true
  dateFormat = '2 Jan 2006'
  rssFeedDescription = 'summary'

  [params.author]
    name = 'Huseyin Hilal'
    intro = 'Huseyin Hilal'
    description = 'Software engineer. Writing down what I learn and keeping a journal along the way.'
    # avatar = 'avatar.jpg'      # kare bir resmi assets/avatar.jpg olarak koyup bu satırın başındaki # işaretini kaldır

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/huseyinhilal'

  [[params.socialIcons]]
    name = 'Rss'
    url = '/index.xml'
